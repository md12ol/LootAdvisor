# Lint only (no formatter). CI blocks on real errors (E9, F63, F7, F82: syntax, undefined names, broken comparisons);
# the rest of this selection is reported as counts. One-line `if x: y` and `a; b` are house style here.
line-length = 120
[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741"]
